<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Coffre Mystérieux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- En-tête avec date et heure -->
        <header class="header">
            <div class="datetime" id="datetime"></div>
            <h1>LE COFFRE MYSTÉRIEUX</h1>
            <p class="subtitle">Tentez votre chance...</p>
        </header>

        <!-- Coffre-fort principal -->
        <div class="safe-container">
            <div class="safe" id="safe">
                <div class="safe-body">
                    <div class="safe-door" id="safe-door">
                        <div class="door-handle"></div>
                        <div class="lock" id="lock">
                            <div class="lock-body"></div>
                            <div class="lock-dial"></div>
                        </div>
                    </div>
                    <div class="safe-shadow"></div>
                </div>
                <div class="safe-base"></div>
            </div>

            <!-- Effet de lumière -->
            <div class="light-effect"></div>
        </div>

        <!-- Interface de code -->
        <div class="code-interface">
            <div class="display" id="display">
                <span class="display-text" id="code-display">____</span>
            </div>
            <div class="keypad" id="keypad">
                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key clear" data-value="C">C</button>
                <button class="key" data-value="0">0</button>
                <button class="key enter" data-value="✓">✓</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="message-container" id="message-container">
            <div class="message" id="message">Entrez un code à 4 chiffres</div>
        </div>

        <!-- Historique des tentatives -->
        <div class="attempts" id="attempts">
            <h3>Dernières tentatives :</h3>
            <ul id="attempts-list"></ul>
        </div>
    </div>

    <!-- Audio pour les effets sonores -->
    <audio id="click-sound" src="https://assets.mixkit.co/sfz/198/198.mp3" preload="auto"></audio>
    <audio id="error-sound" src="https://assets.mixkit.co/sfz/200/200.mp3" preload="auto"></audio>
    <audio id="success-sound" src="https://assets.mixkit.co/sfz/190/190.mp3" preload="auto"></audio>
    <audio id="lock-sound" src="https://assets.mixkit.co/sfz/201/201.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
